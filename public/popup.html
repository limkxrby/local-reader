<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Reader</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header><img src="icons/icon-32.png" alt="" /><div><strong>Local Reader</strong><small>Your offline reading shelf</small></div></header>
      <p id="status" role="status">Checking this page…</p>
      <button id="save" type="button" disabled>Save this page</button>
      <button id="library" class="secondary" type="button">Open library</button>
      <section aria-labelledby="recent-title"><h2 id="recent-title">Recently saved</h2><div id="recent"></div></section>
    </main>
  </body>
</html>
